[metadata]
name = pixamind
url = https://github.com/pixagram-blockchain/pixamind
description = Pixamind: the social indexing and query engine of the Pixa blockchain (a Hivemind fork).
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT


[options]
packages = find:
python_requires = >=3.12
install_requires =
    certifi == 2024.8.30
    ujson == 5.12.0
    urllib3 == 2.2.3
    psycopg2-binary == 2.9.11
    configargparse == 1.7
    diff-match-patch == 20230430
    prometheus-client == 0.21.1
    psutil == 6.1.0
    cffi == 1.17.1
    gitpython == 3.1.43
    pytz == 2024.2


[options.extras_require]
dev =
    pyYAML == 6.0.2
    prettytable == 3.12.0
    ruff >= 0.6.5
    pytest >= 8.0

tests =
    tox == 4.23.2


[options.packages.find]
exclude =
    scripts
    scripts.*
    tests
    tests.*


[options.package_data]
hive = db/sql_scripts/**/*.sql
pixamind = sql/**/*.sql


[options.entry_points]
console_scripts =
    pixamind = pixamind.cli:main
    hive = hive.cli:run
    mocker = hive.indexer.mocking.populate_haf_with_mocked_data:main
